<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA TASK FORCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen p-4">

    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-lg">
        <div class="text-center">
            <img src="./js/data/indexwall.webp" alt="CIA Task Force Logo" class="w-24 h-24 mx-auto mb-4 rounded-full" onerror="this.onerror=null;this.src='https://placehold.co/96x96/cccccc/333333?text=Logo';">
            <h1 class="text-3xl font-bold text-gray-800">CIA TASK FORCE</h1>
            <p class="text-gray-500">Please sign in to continue</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="text-sm font-medium text-gray-700">Username</label>
                <input id="username" name="username" type="text" required class="w-full px-4 py-2 mt-2 text-base text-gray-700 bg-gray-100 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your username">
            </div>
            <div class="relative">
                <label for="password" class="text-sm font-medium text-gray-700">Password</label>
                <input id="password" name="password" type="password" required class="w-full px-4 py-2 mt-2 text-base text-gray-700 bg-gray-100 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your password">
                <span id="togglePassword" class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer" style="top: 28px;">
                    <i class="fa-solid fa-eye text-gray-400"></i>
                </span>
            </div>
            <div>
                <button type="submit" class="w-full py-3 font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Log In
                </button>
            </div>
        </form>
        <div id="message" class="text-center text-sm"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDA_q4-NEMJij-ojfQIahQRFov1n6p7qNM",
          authDomain: "cia-bayanihan-app.firebaseapp.com",
          databaseURL: "https://cia-bayanihan-app-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "cia-bayanihan-app",
          storageBucket: "cia-bayanihan-app.appspot.com",
          messagingSenderId: "35363747720",
          appId: "1:35363747720:web:23840cad1a7f8f3f442c3d",
          measurementId: "G-8BGFGETSKD"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const messageDiv = document.getElementById('message');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.querySelector('i').classList.toggle('fa-eye');
            togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            messageDiv.textContent = 'Checking credentials...';
            messageDiv.className = 'text-center text-sm text-gray-500';

            try {
                const adminsRef = ref(database, 'admins');
                const snapshot = await get(adminsRef);

                if (snapshot.exists()) {
                    const adminsData = snapshot.val();
                    let isValidLogin = false;
                    let loggedInAdmin = null; 

                    for (const adminId in adminsData) {
                        const admin = adminsData[adminId];
                        if (admin.username === username && admin.password === password) {
                            isValidLogin = true;
                            loggedInAdmin = admin; 
                            break; 
                        }
                    }

                    if (isValidLogin) {
                        messageDiv.textContent = 'Login successful! Redirecting...';
                        messageDiv.className = 'text-center text-sm text-green-600 font-semibold';
                        
                        // *** UPDATED: Now saves the admin's role ***
                        sessionStorage.setItem('isLoggedIn', 'true');
                        sessionStorage.setItem('loggedInUser', JSON.stringify({
                            displayName: loggedInAdmin.displayName || 'Admin User',
                            email: loggedInAdmin.email || 'admin@email.com',
                            role: loggedInAdmin.role || 'admin' // <-- Save the role
                        }));

                        setTimeout(() => {
                            window.location.href = './html/dashboard.html';
                        }, 1500);
                    } else {
                        messageDiv.textContent = 'Invalid username or password.';
                        messageDiv.className = 'text-center text-sm text-red-600 font-semibold';
                    }
                } else {
                    messageDiv.textContent = 'Admins data not found in the database.';
                    messageDiv.className = 'text-center text-sm text-red-600 font-semibold';
                }
            } catch (error) {
                messageDiv.textContent = 'An error occurred. Please check console.';
                messageDiv.className = 'text-center text-sm text-red-600 font-semibold';
                console.error("Firebase read failed: ", error);
            }
        });
    </script>
</body>
</html>
