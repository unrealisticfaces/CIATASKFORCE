<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts - Dashboard</title>
    <script type="module" src="../js/auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="flex flex-col h-screen md:flex-row overflow-hidden">
    <button id="menu-btn" class="menu-button p-2 md:hidden">
        <i class="fas fa-bars text-2xl"></i>
    </button>
    
    <div id="overlay" class="overlay"></div>

    <aside id="sidebar" class="sidebar w-64 flex-shrink-0 bg-gray-900 p-4 flex flex-col justify-between z-50">
        <div>
            <div class="flex items-center mb-8">
                 <img src="../js/data/indexwall.webp" alt="CIA Logo" class="h-8 w-8 rounded-full mr-2">
                <h1 class="text-xl font-bold text-white">CIA TASK FORCE</h1>
            </div>
            <nav class="space-y-2">
                <a href="./dashboard.html" class="flex items-center px-4 py-2.5 text-sm font-medium text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg"><i class="fas fa-home sidebar-icon mr-3"></i> Home</a>
                <a href="./register.html" class="flex items-center px-4 py-2.5 text-sm font-medium text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg"><i class="fas fa-user-plus sidebar-icon mr-3"></i> Register</a>
                <a href="./accounts.html" class="flex items-center px-4 py-2.5 text-sm font-medium text-white bg-gray-700 rounded-lg"><i class="fas fa-users sidebar-icon mr-3"></i> Accounts</a>
                <a href="./analytics.html" class="flex items-center px-4 py-2.5 text-sm font-medium text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg"><i class="fas fa-chart-line sidebar-icon mr-3"></i> Analytics</a>
                <a id="settings-link" href="./settings.html" class="flex items-center px-4 py-2.5 text-sm font-medium text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg"><i class="fas fa-cog sidebar-icon mr-3"></i> Settings</a>
            </nav>
        </div>
        <div class="relative">
            <div id="logoutMenu" class="absolute bottom-full left-0 mb-2 w-full bg-gray-800 rounded-lg shadow-lg hidden">
                <a href="#" id="logoutButton" class="flex items-center px-4 py-3 text-sm text-red-400 hover:bg-gray-700 rounded-lg"><i class="fas fa-sign-out-alt w-5 h-5 mr-3"></i>Logout</a>
            </div>
            <div id="userProfileButton" class="flex items-center p-2 border-t border-gray-700 mt-4 cursor-pointer hover:bg-gray-800 rounded-lg">
                <img class="h-10 w-10 rounded-full object-cover" src="https://placehold.co/100x100/667eea/ffffff?text=RR" alt="User avatar">
                <div class="ml-3">
                    <p class="text-sm font-semibold text-white">Riley Carter</p>
                    <p class="text-xs text-gray-400">riley@email.com</p>
                </div>
                 <div class="ml-auto text-gray-400"><i class="fas fa-ellipsis-v"></i></div>
            </div>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 main-content">
        <header class="flex items-center justify-between pb-4 border-b border-gray-700">
            <div>
                <h2 class="text-2xl font-bold text-white">User Accounts</h2>
                <p class="text-gray-400">List of all registered users in the system.</p>
            </div>
        </header>

        <div class="mt-6 mb-4">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-search text-gray-400"></i>
                </div>
                <input type="text" id="search-input" class="w-full md:w-1/3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 pl-10 pr-4 py-2" placeholder="Search by name or ID...">
            </div>
        </div>

        <div class="bg-gray-800 rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-300">
                    <thead class="text-xs text-gray-400 uppercase bg-gray-900">
                        <tr>
                            <th scope="col" class="p-4"><input type="checkbox" class="bg-gray-700 border-gray-600 rounded"></th>
                            <th scope="col" class="px-6 py-3">User ID</th>
                            <th scope="col" class="px-6 py-3">Full Name</th>
                            <th scope="col" class="px-6 py-3">Contact No.</th>
                            <th scope="col" class="px-6 py-3">Join Date</th>
                            <th scope="col" class="px-6 py-3">Added By</th> <!-- NEW COLUMN -->
                            <th scope="col" class="px-6 py-3">Status</th>
                            <th scope="col" class="px-6 py-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr class="border-b border-gray-700"><td colspan="8" class="text-center px-6 py-12 text-gray-400">Loading user data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/accounts.js"></script>
    
    <script>
        document.getElementById('menu-btn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').style.display = 'block';
        });

        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').style.display = 'none';
        });
    </script>

     <script>
        try {
            const loggedInUserString = sessionStorage.getItem('loggedInUser');
            if (loggedInUserString) {
                const loggedInUser = JSON.parse(loggedInUserString);
                if (loggedInUser.role === 'superadmin') {
                    document.body.classList.add('role-superadmin');
                } else {
                    document.body.classList.add('role-admin');
                }
            }
        } catch (e) { console.error('Role initialization script failed:', e); }
    </script>
    
    <button id="menu-btn" class="menu-button p-2 md:hidden">
</body>
</html>
