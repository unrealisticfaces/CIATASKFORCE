<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Dashboard</title>
    <script type="module" src="../js/auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        /* --- Base Container --- */
        .tree-wrapper {
            position: relative;
            overflow-x: auto; /* fallback scroll if tree is wide */
            -webkit-overflow-scrolling: touch;
        }
        /* The SVG layer for drawing lines sits behind the user cards on DESKTOP ONLY */
        #tree-lines-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none; /* Allows clicking through the SVG to the cards */
        }
        /* The container for the user cards sits on top */
        #genealogy-container {
            position: relative;
            z-index: 1;
        }

        /* --- Universal Card Styles --- */
        .tree a {
            border: 2px solid #4b5563;
            padding: 12px 16px;
            text-decoration: none;
            color: #d1d5db;
            background-color: #1f2937;
            font-family: 'Inter', sans-serif;
            display: inline-block;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .tree a:hover {
            background: #374151;
            color: #fff;
            border: 2px solid #9ca3af;
        }
        .tree ul, .tree li {
            list-style: none;
            padding: 0;
            margin: 0;
            position: relative;
        }

        /* --- 1. DESKTOP-ONLY STYLES (Horizontal View) --- */
        .tree.desktop-tree {
            text-align: center;
        }
        .tree.desktop-tree ul { padding-top: 20px; white-space: nowrap; }
        .tree.desktop-tree li { display: inline-block; vertical-align: top; padding: 20px 5px 0 5px; }
        .tree.desktop-tree a { min-width: 150px; }

        /* --- 2. MOBILE-ONLY STYLES (Vertical Tree View) --- */
        .tree.mobile-tree { 
            text-align: left; 
        }
        .tree.mobile-tree ul { 
            padding-left: 16px; 
            margin-left: 12px;
            border-left: 2px solid #374151;
        }
        .tree.mobile-tree li { 
            margin: 12px 0; 
            position: relative;
        }
        /* Draw horizontal connectors */
        .tree.mobile-tree li::before {
            content: '';
            position: absolute;
            top: 16px;
            left: -12px;
            width: 12px;
            height: 2px;
            background: #374151;
        }
        /* Remove indentation for root list */
        .tree.mobile-tree > ul {
            padding-left: 0;
            margin-left: 0;
            border-left: none;
        }
        .tree.mobile-tree a { 
            width: 100%; 
        }
        @media (max-width: 480px) {
        .tree.mobile-tree a {
            display: block;
            width: 100%;
            max-width: 80%;   /* prevent overflowing */
            font-size: 9px;  /* smaller text for better fit */
            padding: 10px 10px;
        }
        .tree.mobile-tree .font-bold {
            font-size: 15px;  /* name text slightly smaller */
        }
        .tree.mobile-tree .text-xs {
            font-size: 12px;  /* ID text smaller */
        }
    }
    </style>
</head>
<body class="h-screen">
    <button id="menu-btn" class="menu-button p-2 md:hidden">
        <i class="fas fa-bars text-2xl"></i>
    </button>
    <div id="overlay" class="overlay"></div>
    <div class="flex flex-col h-screen md:flex-row main-wrapper">
        <aside id="sidebar" class="sidebar w-64 flex-shrink-0 bg-gray-900 p-4 flex flex-col justify-between z-50">
            <div>
                <div class="flex items-center mb-8">
                    <img src="../js/data/indexwall.png" alt="CIA Logo" class="h-8 w-8 rounded-full mr-2">
                    <h1 class="text-xl font-bold text-white">CIA TASK FORCE</h1>
                </div>
                <nav class="space-y-2">
                    <a href="./dashboard.html" class="flex items-center px-4 py-2.5 text-sm font-medium text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg"><i class="fas fa-home sidebar-icon mr-3"></i> Home</a>
                    <a href="./register.html" class="flex items-center px-4 py-2.5 text-sm font-medium text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg"><i class="fas fa-user-plus sidebar-icon mr-3"></i> Register</a>
                    <a href="./accounts.html" class="flex items-center px-4 py-2.5 text-sm font-medium text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg"><i class="fas fa-users sidebar-icon mr-3"></i> Accounts</a>
                    <a href="./analytics.html" class="flex items-center px-4 py-2.5 text-sm font-medium text-white bg-gray-700 rounded-lg"><i class="fas fa-chart-line sidebar-icon mr-3"></i> Analytics</a>
                    <a href="#" class="flex items-center px-4 py-2.5 text-sm font-medium text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg"><i class="fas fa-cog sidebar-icon mr-3"></i> Settings</a>
                </nav>
            </div>
            <div class="relative">
                <div id="logoutMenu" class="absolute bottom-full left-0 mb-2 w-full bg-gray-800 rounded-lg shadow-lg hidden">
                    <a href="#" id="logoutButton" class="flex items-center px-4 py-3 text-sm text-red-400 hover:bg-gray-700 rounded-lg"><i class="fas fa-sign-out-alt w-5 h-5 mr-3"></i>Logout</a>
                </div>
                <div id="userProfileButton" class="flex items-center p-2 border-t border-gray-700 mt-4 cursor-pointer hover:bg-gray-800 rounded-lg">
                    <img class="h-10 w-10 rounded-full object-cover" src="https://placehold.co/100x100/667eea/ffffff?text=RR" alt="User avatar">
                    <div class="ml-3">
                        <p class="text-sm font-semibold text-white">Riley Carter</p>
                        <p class="text-xs text-gray-400">riley@email.com</p>
                    </div>
                    <div class="ml-auto text-gray-400"><i class="fas fa-ellipsis-v"></i></div>
                </div>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-8 main-content">
            <header class="flex items-center justify-between pb-4 border-b border-gray-700">
                <div>
                    <h2 class="text-2xl font-bold text-white">Referral Genealogy</h2>
                    <p class="text-gray-400">Search for a user to visualize their referral network.</p>
                </div>
            </header>

            <div class="mt-6 mb-6">
                <form id="genealogy-search-form" class="flex items-center gap-4">
                    <input type="text" id="search-id-input" class="w-full md:w-1/3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 px-4 py-2" placeholder="Enter Referrer's ID to view their tree...">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline">
                        Search
                    </button>
                </form>
            </div>

            <div class="bg-gray-800 p-8 rounded-lg overflow-x-auto">
                <div class="tree-wrapper">
                    <svg id="tree-lines-svg"></svg>
                    <div class="tree" id="tree-root">
                         <div id="genealogy-container" class="text-center">
                            <p class="text-gray-400">Please search for a User ID to display a genealogy tree.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/analytics.js"></script>
    
    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menu-btn');
        
        menuBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            sidebar.classList.toggle('open');
            overlay.style.display = 'block';
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.style.display = 'none';
        });
    </script>
</body>
</html>
